name: Validate Shadowrocket configuration

on:
  push:
    paths:
      - "Shadowrocket-v2.conf"
      - "rules/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Shadowrocket-v2.conf"
      - "rules/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate maintained files
        run: python scripts/validate_shadowrocket.py
